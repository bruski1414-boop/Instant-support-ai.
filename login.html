<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secure Veyra AI workspace sign-in."><title>Veyra AI | Sign in</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--line:#263344;--text:#f4f7fb;--muted:#94a3b8;--blue:#b9d8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 70% -20%,#172b42 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.panel{width:min(100%,430px);padding:34px;border:1px solid var(--line);border-radius:18px;background:#101722;box-shadow:0 24px 80px #0007}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.1em}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#eaf4ff,#7aaaff);color:#06101a;font-size:20px}h1{font-size:27px;margin:28px 0 5px}p{color:var(--muted);margin:0 0 24px}label{display:block;margin:16px 0 6px;font-size:13px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #35465b;background:#080e17;color:white;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:linear-gradient(100deg,var(--blue),#aab5ff);color:#08111b;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-top:15px;color:#f3c879;font-size:13px}.back{display:block;margin-top:18px;text-align:center;color:#b9d8f5;text-decoration:none;font-size:13px}
</style></head><body><main class="panel"><div class="brand"><span class="logo">V</span> VEYRA AI</div><h1>Welcome back</h1><p>Sign in to your Veyra workspace.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="submit" type="submit">Sign in securely</button><div id="status" role="status" aria-live="polite"></div></form><a class="back" href="/">← Back to Veyra AI</a></main>
<script>
const form=document.getElementById("loginForm");
form.addEventListener("submit",async(event)=>{event.preventDefault();const button=document.getElementById("submit");const status=document.getElementById("status");button.disabled=true;status.textContent="Signing in…";try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:form.elements.email.value,password:form.elements.password.value}),credentials:"same-origin"});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Sign-in failed. Please try again.");window.location.assign("/dashboard.html");}catch(error){status.textContent=error.message||"Sign-in failed.";button.disabled=false;}});
</script></body></html>
