<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI invitation</title><style>body{font:16px system-ui;background:#080c12;color:#f3f7fc;display:grid;place-items:center;min-height:100vh}.card{max-width:420px;padding:28px;background:#101925;border:1px solid #29394d;border-radius:16px}label{display:block;margin:14px 0 5px}input{width:100%;padding:11px;background:#080e16;color:white;border:1px solid #33445b;border-radius:8px}button{margin-top:18px;padding:12px;width:100%}.notice{margin-top:12px}</style></head><body><main class="card"><h1>Join your hotel team</h1><p id="workspace"></p><form id="form"><label>Email invited</label><input id="email" type="email" required maxlength="254"><label>Create password (12+ characters)</label><input id="password" type="password" required minlength="12" maxlength="200"><button>Create account</button></form><p id="notice" class="notice"></p></main><script>
const p=new URLSearchParams(location.search),workspace=p.get("workspace")||"",token=p.get("token")||"",form=document.getElementById("form"),notice=document.getElementById("notice");
document.getElementById("workspace").textContent="Workspace: "+workspace;
if(!/^[a-z0-9-]{1,48}$/.test(workspace)||!/^[A-Za-z0-9_-]{40,64}$/.test(token)){form.hidden=true;notice.textContent="Invalid invitation link.";}
form.addEventListener("submit",async e=>{e.preventDefault();const b=form.querySelector("button");b.disabled=true;try{const r=await fetch("/api/invitations/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({workspace,token,email:document.getElementById("email").value,password:document.getElementById("password").value})});const x=await r.json();if(!r.ok)throw Error(x.error||"Invitation could not be accepted.");form.hidden=true;notice.textContent="Account created. Sign in on the dashboard with workspace "+x.workspace+"."; }catch(err){notice.textContent=err.message;b.disabled=false;}});
</script></body></html>
