name: Fly standby container build

on:
  pull_request:
    branches:
      - fix/demo-hotel-faq-intents
    paths:
      - "Dockerfile"
      - "fly.toml"
      - ".dockerignore"
      - ".github/workflows/fly-container.yml"
      - "package.json"
      - "server.js"
      - "**/*.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build standby image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: veyra-standby:ci
