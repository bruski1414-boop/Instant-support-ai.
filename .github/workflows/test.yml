name: Veyra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veyra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/veyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/veyra_test DATABASE_SSL=false VEYRA_TENANT_TEST_DATABASE=true npm run test:integration
