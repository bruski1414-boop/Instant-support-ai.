<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Guest support powered by Veyra AI"><title>Guest Support | Veyra AI</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#101722;--line:#263344;--text:#f4f7fb;--muted:#94a3b8;--blue:#b9d8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#1a3049 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:18px}.chat{width:min(100%,720px);height:min(820px,calc(100vh - 36px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:#101722;overflow:hidden;box-shadow:0 24px 80px #0008}.head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#eaf4ff,#7aaaff);color:#06101a;font-weight:900;font-size:20px}.head strong{letter-spacing:.12em}.head small{display:block;color:var(--muted)}#messages{padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;padding:12px 15px;border-radius:14px;background:#1a2737;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#d8e9fa;color:#101722}.bubble.assistant{align-self:flex-start}.bubble.system{align-self:center;color:#f1c77b;background:#30291d;font-size:13px}.composer{border-top:1px solid var(--line);padding:16px;display:flex;gap:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.composer textarea{flex:1;resize:none;min-height:48px;max-height:130px;padding:13px;border-radius:10px;border:1px solid #35465b;background:#080e17;color:white;font:inherit}.composer button{padding:0 20px;border:0;border-radius:10px;background:linear-gradient(100deg,var(--blue),#aab5ff);color:#08111b;font-weight:750;cursor:pointer}.composer textarea:disabled{opacity:.65}.composer button:disabled{opacity:.5;cursor:wait}.foot{text-align:center;padding:0 12px 12px;color:#718198;font-size:11px}
</style></head><body><main class="chat"><header class="head"><span class="logo">V</span><div><strong>VEYRA AI</strong><small>Guest support assistant</small></div></header><section id="messages" aria-live="polite" aria-relevant="additions text"><div class="bubble assistant">Hello. How can we help you today?</div></section><form class="composer" id="form"><label class="sr-only" for="message">Your message</label><textarea id="message" maxlength="2000" placeholder="Type your question…" aria-describedby="composerHint" required></textarea><button id="send" type="submit">Send</button></form><div class="foot" id="composerHint">Answers use approved hotel information. Messages may be stored and reviewed by hotel staff. Staff must confirm bookings, payments and other important changes.</div></main>
<script>
const params=new URLSearchParams(location.search);const tenant=params.get("workspace")||"";const messages=document.getElementById("messages");const form=document.getElementById("form");const input=document.getElementById("message");const send=document.getElementById("send");const composerHint=document.getElementById("composerHint");const storageKey="veyra-conversation-"+tenant;
function readConversation(){try{return sessionStorage.getItem(storageKey)||"";}catch{return "";}}
function saveConversation(id){try{sessionStorage.setItem(storageKey,id);}catch{/* Session storage may be unavailable; this chat can still work. */}}
let conversationId=readConversation();
function bubble(text,kind){const node=document.createElement("div");node.className="bubble "+kind;node.textContent=text;messages.append(node);messages.scrollTop=messages.scrollHeight;}
function setSending(active){send.disabled=active;input.disabled=active;form.setAttribute("aria-busy",String(active));send.textContent=active?"Sending…":"Send";}
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(tenant)){bubble("This support link is invalid. Please ask the hotel for its current support link.","system");form.hidden=true;}
form.addEventListener("submit",async event=>{event.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;setSending(true);bubble(text,"user");composerHint.textContent="Sending your message securely…";try{const response=await fetch("/api/public/"+encodeURIComponent(tenant)+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,conversationId:conversationId||undefined})});const data=await response.json().catch(()=>({}));if(!response.ok){bubble(data.error||"Support is temporarily unavailable. Please contact the hotel directly.","system");composerHint.textContent="Your message was not confirmed. You can try again or contact the hotel directly.";return;}if(typeof data.reply!=="string"||!data.reply.trim()||typeof data.conversationId!=="string"){bubble("We received an unexpected response. Please contact the hotel directly if you need help.","system");composerHint.textContent="We couldn't confirm the reply. Please contact the hotel directly.";return;}conversationId=data.conversationId;saveConversation(conversationId);input.value="";bubble(data.reply,"assistant");if(data.needsHuman){bubble("This conversation is in the hotel staff review queue. Please contact reception directly for urgent or time-sensitive matters.","system");if(data.notificationStatus==="delivery-failed"||data.notificationStatus==="not-configured")bubble("An automatic staff alert was not confirmed. Please contact reception directly.","system");}composerHint.textContent="Your message was sent. You can ask another question below.";}catch(error){bubble("We couldn't connect. Your message has not been confirmed. Please try again or contact the hotel directly.","system");composerHint.textContent="Connection issue. Please try again or contact the hotel directly.";}finally{setSending(false);input.focus();}});
</script></body></html>
