<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Guest support powered by Veyra AI"><title>Guest Support | Veyra AI</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#101722;--line:#263344;--text:#f4f7fb;--muted:#94a3b8;--blue:#b9d8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#1a3049 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:18px}.chat{width:min(100%,720px);height:min(820px,calc(100vh - 36px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:#101722;overflow:hidden;box-shadow:0 24px 80px #0008}.head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#eaf4ff,#7aaaff);color:#06101a;font-weight:900;font-size:20px}.head strong{letter-spacing:.12em}.head small{display:block;color:var(--muted)}#messages{padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;padding:12px 15px;border-radius:14px;background:#1a2737;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#d8e9fa;color:#101722}.bubble.assistant{align-self:flex-start}.bubble.system{align-self:center;color:#f1c77b;background:#30291d;font-size:13px}.composer{border-top:1px solid var(--line);padding:16px;display:flex;gap:10px}.composer textarea{flex:1;resize:none;min-height:48px;max-height:130px;padding:13px;border-radius:10px;border:1px solid #35465b;background:#080e17;color:white;font:inherit}.composer button{padding:0 20px;border:0;border-radius:10px;background:linear-gradient(100deg,var(--blue),#aab5ff);color:#08111b;font-weight:750;cursor:pointer}.composer button:disabled{opacity:.5}.foot{text-align:center;padding:0 12px 12px;color:#718198;font-size:11px}
</style></head><body><main class="chat"><header class="head"><span class="logo">V</span><div><strong>VEYRA AI</strong><small>Guest support assistant</small></div></header><section id="messages" aria-live="polite"><div class="bubble assistant">Hello. How can we help you today?</div></section><form class="composer" id="form"><textarea id="message" maxlength="2000" placeholder="Type your question…" required></textarea><button id="send" type="submit">Send</button></form><div class="foot">AI answers are based on approved hotel information. Staff must confirm bookings, payments and other important changes.</div></main>
<script>
const params=new URLSearchParams(location.search);const tenant=params.get("workspace")||"";let conversationId=sessionStorage.getItem("veyra-conversation-"+tenant)||"";const messages=document.getElementById("messages");const form=document.getElementById("form");const input=document.getElementById("message");const send=document.getElementById("send");
function bubble(text,kind){const node=document.createElement("div");node.className="bubble "+kind;node.textContent=text;messages.append(node);messages.scrollTop=messages.scrollHeight;}
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(tenant)){bubble("This support link is invalid. Please ask the hotel for its current support link.","system");form.hidden=true;}
form.addEventListener("submit",async event=>{event.preventDefault();const text=input.value.trim();if(!text)return;input.value="";bubble(text,"user");send.disabled=true;try{const response=await fetch("/api/public/"+encodeURIComponent(tenant)+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,conversationId:conversationId||undefined})});const data=await response.json().catch(()=>({}));if(!response.ok){bubble(data.error||"Support is temporarily unavailable. Please contact the hotel directly.","system");return;}conversationId=data.conversationId;sessionStorage.setItem("veyra-conversation-"+tenant,conversationId);bubble(data.reply,"assistant");if(data.needsHuman)bubble("This conversation has been marked for hotel staff review. Please contact reception directly for urgent or time-sensitive matters.","system");}catch(error){bubble("We couldn't connect. Please try again or contact the hotel directly.","system");}finally{send.disabled=false;input.focus();}});
</script></body></html>
