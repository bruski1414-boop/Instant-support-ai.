name: Node CI

on:
  push:
    branches:
      - feature/mews-demo-connector
  pull_request:
    branches:
      - feature/pms-adapter-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax checks and unit tests
        run: npm test
